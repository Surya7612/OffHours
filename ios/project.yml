name: OffHours
options:
  bundleIdPrefix: com.suryanediyadeth
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.31.0

settings:
  base:
    DEVELOPMENT_TEAM: 72285WRA34
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OffHours:
    type: application
    platform: iOS
    sources:
      - path: OffHours
        excludes:
          - "Config/*.xcconfig"
    configFiles:
      Debug: OffHours/Config/Config.xcconfig
      Release: OffHours/Config/Config.xcconfig
    dependencies:
      - package: Supabase
    entitlements:
      path: OffHours/OffHours.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    info:
      path: OffHours/Info.plist
      properties:
        CFBundleDisplayName: OffHours
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: OffHours uses your location to suggest real places near you for tonight's activity and to show gatherings in your neighborhood.
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suryanediyadeth.offhours
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SWIFT_STRICT_CONCURRENCY: complete

  OffHoursTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OffHoursTests
    dependencies:
      - target: OffHours
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suryanediyadeth.offhours.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  OffHours:
    build:
      targets:
        OffHours: all
    test:
      targets:
        - OffHoursTests
